<style>
:root{
  --bg:#fbf7ef; --panel:#ffffff; --ink:#1d1a16; --muted:#675d51; --line:#e4dccd;
  --brick:#b4412c; --gold:#f2b705; --gold-ink:#000000; --link:#8a2e1c; --bar:#d9cdb8; --bar-on:#b4412c;
  --shadow:0 6px 24px rgba(40,25,10,.14);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16130f; --panel:#221d17; --ink:#f4ede0; --muted:#bdb2a1; --line:#3a3226; --link:#f0a58f; --bar:#4a4032; --bar-on:#e0654a; --shadow:0 6px 24px rgba(0,0,0,.5);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Thonburi,sans-serif}
a{color:var(--link)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0}
.mark{font-size:14px;color:var(--muted);letter-spacing:.02em}
.lang{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.eyebrow{margin:34px 0 4px;font-size:14px;color:var(--brick);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-color-scheme:dark){.eyebrow{color:#e8826a}}
h1{font:700 clamp(32px,8.4vw,54px)/1.08 Georgia,"Times New Roman","Noto Serif Thai",serif;margin:0 0 14px;letter-spacing:-.01em}
.lead{font-size:18px;color:var(--ink);margin:0 0 18px;max-width:34em}
.slot{height:64px;border-radius:14px;margin:6px 0 18px;background:linear-gradient(120deg,var(--line),transparent 70%);border:1px dashed var(--line)}
.counter{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 10px}
.big{font:700 clamp(76px,24vw,150px)/.9 Georgia,serif;color:var(--brick);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
@media (prefers-color-scheme:dark){.big{color:#e8826a}}
.big-l{font-size:19px;max-width:11em;line-height:1.25}
.sub{color:var(--muted);font-size:15px;margin:0 0 6px}
.mapbox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#e9e4d8}
#map{height:min(56vh,520px);min-height:340px;width:100%}
.card{position:relative;margin-top:10px;background:var(--panel);color:var(--ink);border-radius:14px;padding:14px 14px 14px;border:1px solid var(--line);min-height:138px}
.card .empty{margin:0;color:var(--muted);font-size:16px;padding-top:6px}
.card .full{display:none}
.card.on .full{display:block}
.card.on .empty{display:none}
.card h3{margin:0 28px 2px 0;font-size:19px;line-height:1.25}
.card .meta{margin:0 0 10px;font-size:14px;color:var(--muted)}
.card .x{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:999px;font:600 15px/1.2 inherit;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ctl{margin:16px 0 4px}
.years{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end}
.yb{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:96px;min-width:0}
.yb .bar{background:var(--bar);border-radius:5px 5px 0 0;transition:background .3s,height .3s;min-height:4px}
.yb.on .bar{background:var(--bar-on)}
.yb.cur .bar{background:var(--gold);outline:2px solid var(--ink);outline-offset:-2px}
.yb .n{font-size:12px;text-align:center;margin-bottom:2px;color:var(--ink)}
.yb .y{text-align:center;padding:4px 0 2px;font-size:13px;color:var(--ink)}
.yb.cur .y{font-weight:700}
.row{display:flex;gap:10px;align-items:center;margin-top:6px}
input[type=range]{flex:1;min-width:0;height:44px;accent-color:#b4412c}
.play{flex:none;min-width:92px}
.yl{font-size:16px;margin:10px 0 0}
.yl b{font-variant-numeric:tabular-nums}
.new{margin:12px 0 0}
.new summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:4px 2px 6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;padding:6px 12px;min-height:36px;cursor:pointer;text-align:left}
section{margin-top:52px}
h2{font:700 clamp(26px,6.4vw,38px)/1.15 Georgia,"Noto Serif Thai",serif;margin:0 0 12px}
.vids{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 0;padding:0;list-style:none}
@media (min-width:640px){.vids{grid-template-columns:1fr 1fr}}
.v{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.v .th{display:block;aspect-ratio:16/9;background:var(--line);position:relative}
.v .th img{width:100%;height:100%;object-fit:cover;display:block}
.v .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.v .tt{font-weight:600;line-height:1.3;color:var(--ink);text-decoration:none}
.v .ag{font-size:13px;color:var(--muted)}
.v .sits{font-size:14px;margin-top:auto}
.cta{margin-top:56px;padding:26px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center}
.cta p{margin:0 auto 16px;max-width:30em}
.cta .btn{font-size:18px;min-height:52px;padding:10px 26px}
.sig{margin-top:14px;color:var(--muted);font-size:15px}
.src{font-size:13.5px;color:var(--muted);margin-top:46px;border-top:1px solid var(--line);padding-top:16px}
.src h3{font-size:14px;margin:0 0 6px;color:var(--ink)}
.src ul{margin:0;padding-left:18px}
.src li{margin:3px 0}
.srcl{font-size:13px;color:var(--muted);margin:10px 0 0}
footer{padding:22px 0 40px;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
.maplibregl-ctrl-attrib{font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  {en:'CityNews: Giant branch of 200 year old yang tree crashes down at Wat Chedi Luang', th:null},
  {en:'Creative expression brings a classic poem into Gen Alpha era at Pathfinders International School', th:null},
  {en:'Akha Heritage museum by Akhas and for everyone in Chiang Rai', th:null},
  {en:'We made pasta! Limeleaf Kitchen’s Cooking Workshops are fun for all', th:null}
];

let lang = (navigator.language||'en').toLowerCase().startsWith('th') ? 'th' : 'en';
let Y = 6;                       // index into YEARS
let sel = -1;
let timer = null;
let mapReady = false;
const N = DATA.length;
const byYear = YEARS.map(y => DATA.filter(d => d.y === y).length);
const cum = []; byYear.reduce((a,c,i)=>{cum[i]=a+c;return a+c},0);

const $ = id => document.getElementById(id);
const t = (k, o) => { let s = (T[lang][k] ?? T.en[k] ?? ''); if (o) for (const p in o) s = s.split('{'+p+'}').join(o[p]); return s.split('{n}').join(N); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* counter */
let shown = 0, tween = null;
function setCount(to){
  clearInterval(tween);
  const from = shown, t0 = Date.now(), dur = 650;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){ shown = to; $('count').textContent = to; return; }
  tween = setInterval(()=>{
    const p = Math.min(1,(Date.now()-t0)/dur), e = 1-Math.pow(1-p,3);
    shown = Math.round(from + (to-from)*e);
    $('count').textContent = shown;
    if (p>=1){ clearInterval(tween); shown = to; $('count').textContent = to; }
  }, 30);
}

/* year controls */
function buildYears(){
  const max = Math.max(...byYear);
  $('years').innerHTML = YEARS.map((y,i)=>
    `<button class="yb" type="button" data-i="${i}" aria-label="${y}: ${byYear[i]}">
       <span class="n">${byYear[i]}</span><span class="bar" style="height:${Math.max(4,Math.round(byYear[i]/max*60))}px"></span><span class="y">${y}</span>
     </button>`).join('');
  $('years').onclick = e => { const b = e.target.closest('.yb'); if (b){ stop(); setYear(+b.dataset.i); } };
}
function renderControls(){
  document.querySelectorAll('.yb').forEach((b,i)=>{ b.classList.toggle('on', i<=Y); b.classList.toggle('cur', i===Y); });
  $('yr').value = Y;
  $('count').setAttribute('data-n', cum[Y]);
  $('sub').textContent = Y===6 ? t('sub_all') : t('sub_y',{c:cum[Y],y:YEARS[Y]});
  $('yl').innerHTML = t('yl',{y:YEARS[Y],k:byYear[Y]});
  $('newsum').textContent = t('newsum',{y:YEARS[Y],k:byYear[Y]});
  const ids = DATA.map((d,i)=>i).filter(i=>DATA[i].y===YEARS[Y]);
  $('chips').innerHTML = ids.map(i=>`<button class="chip" type="button" data-p="${i}">${esc(DATA[i].n)}</button>`).join('');
}
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) select(+b.dataset.p, true); };
function setYear(i, animate){
  Y = i;
  setCount(cum[Y]);
  renderControls();
  if (sel>=0 && DATA[sel].y > YEARS[Y]) closeCard();
  if (mapReady) applyFilters(animate !== false);
}
$('yr').addEventListener('input', e => { stop(); setYear(+e.target.value); });

function stop(){ if (timer){ clearInterval(timer); timer=null; } $('play').textContent = t(Y===6 ? 'replay':'play'); }
function play(){
  if (timer){ stop(); return; }
  setYear(0);
  $('play').textContent = t('pause');
  timer = setInterval(()=>{
    if (Y>=6){ stop(); return; }
    setYear(Y+1);
    if (Y>=6){ clearInterval(timer); timer=null; $('play').textContent = t('replay'); }
  }, 1100);
}
$('play').onclick = play;

/* card */
function mdUrl(d){ return d.m ? MD_BASE + d.m : null; }
function renderCard(){
  if (sel<0) return;
  const d = DATA[sel];
  $('cn').textContent = d.n;
  const cat = (CAT[d.c]||[null,null])[lang==='th'?1:0];
  $('cm').textContent = t('from',{y:d.y}) + (cat ? ' · '+cat : '');
  $('cl').href = CL_BASE + d.s + '/'; $('cl').textContent = t('cl');
  const m = mdUrl(d);
  $('md').style.display = m ? '' : 'none';
  if (m){ $('md').href = m; $('md').textContent = t('md'); }
  $('cardx').setAttribute('aria-label', t('close'));
}
function select(i, fly){
  sel = i;
  const d = DATA[i];
  if (d.y > YEARS[Y]){ stop(); setYear(YEARS.indexOf(d.y)); }
  renderCard();
  $('card').classList.add('on');
  if (mapReady){
    map.setFilter('sel', ['==',['get','i'],i]);
    map.easeTo({center:[d.o,d.a], zoom: Math.max(map.getZoom(), 14), duration: 700});
  }
  if (fly) $('map').scrollIntoView({block:'center',behavior:'smooth'});
}
function closeCard(){ sel=-1; $('card').classList.remove('on'); if (mapReady) map.setFilter('sel',['==',['get','i'],-1]); }
$('cardx').onclick = closeCard;

/* map */
const q = (arr,p) => { const a = arr.slice().sort((x,y)=>x-y); return a[Math.round((a.length-1)*p)]; };
const bounds = new maplibregl.LngLatBounds(
  [q(DATA.map(d=>d.o),0.04), q(DATA.map(d=>d.a),0.04)],
  [q(DATA.map(d=>d.o),0.96), q(DATA.map(d=>d.a),0.96)]);
const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  bounds, fitBoundsOptions:{padding:28},
  cooperativeGestures:true,
  locale:{
    'CooperativeGesturesHandler.WindowsHelpText':'Ctrl + scroll to zoom the map · กด Ctrl แล้วเลื่อนเพื่อซูม',
    'CooperativeGesturesHandler.MacHelpText':'⌘ + scroll to zoom the map · กด ⌘ แล้วเลื่อนเพื่อซูม',
    'CooperativeGesturesHandler.MobileHelpText':'Use two fingers to move the map · ใช้สองนิ้วเลื่อนแผนที่'
  },
  attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');

function applyFilters(animate){
  const y = YEARS[Y];
  map.setFilter('old', ['<',['get','y'],y]);
  map.setFilter('new', ['==',['get','y'],y]);
  map.setFilter('halo', ['==',['get','y'],y]);
  if (animate && !matchMedia('(prefers-reduced-motion:reduce)').matches){
    const t0 = performance.now();
    (function f(now){
      const p = Math.min(1,(now-t0)/900);
      map.setPaintProperty('halo','circle-radius', 8 + 26*p);
      map.setPaintProperty('halo','circle-opacity', 0.55*(1-p));
      if (p<1) requestAnimationFrame(f);
    })(t0);
  }
}
map.on('load', () => {
  map.addSource('pins',{type:'geojson',data:{type:'FeatureCollection',features:DATA.map((d,i)=>({type:'Feature',properties:{i,y:d.y},geometry:{type:'Point',coordinates:[d.o,d.a]}}))}});
  map.addLayer({id:'halo',type:'circle',source:'pins',filter:['==',['get','y'],2020],paint:{'circle-color':'#f2b705','circle-radius':8,'circle-opacity':0}});
  map.addLayer({id:'old',type:'circle',source:'pins',filter:['<',['get','y'],2020],paint:{'circle-color':'#b4412c','circle-radius':['interpolate',['linear'],['zoom'],10,4,15,8],'circle-stroke-color':'#ffffff','circle-stroke-width':1.5,'circle-opacity':0.92}});
  map.addLayer({id:'new',type:'circle',source:'pins',filter:['==',['get','y'],2020],paint:{'circle-color':'#f2b705','circle-radius':['interpolate',['linear'],['zoom'],10,6,15,11],'circle-stroke-color':'#000000','circle-stroke-width':2}});
  map.addLayer({id:'sel',type:'circle',source:'pins',filter:['==',['get','i'],-1],paint:{'circle-color':'rgba(0,0,0,0)','circle-radius':['interpolate',['linear'],['zoom'],10,12,15,18],'circle-stroke-color':'#000000','circle-stroke-width':3}});
  mapReady = true;
  applyFilters(false);
  map.on('click', e => {
    const r = 14, box = [[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]];
    const f = map.queryRenderedFeatures(box,{layers:['old','new']});
    if (f.length){
      // nearest to the tap
      let best=f[0], bd=1e9;
      f.forEach(x=>{ const p=map.project(x.geometry.coordinates); const dd=(p.x-e.point.x)**2+(p.y-e.point.y)**2; if(dd<bd){bd=dd;best=x;} });
      stop(); select(best.properties.i, false);
    }
  });
  ['old','new'].forEach(l=>{
    map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  });
  // one slow first pass unless the visitor prefers calm
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting){ io.disconnect(); setTimeout(()=>{ if (!timer && sel<0 && Y===6) play(); }, 600); } }, {threshold:0.6});
    io.observe($('map'));
  }
});
map.on('error', e => { try{ console.log('map', e.error && e.error.message); }catch(_){} });

/* videos */
function renderVids(){
  $('vids').innerHTML = VIDS.map((v,i)=>{
    const ago = T[lang].ago[i];
    const sits = v.md ? `<div class="sits">${t('sits')}: <a href="${esc(MD_BASE+v.md)}" target="_blank" rel="noopener">${esc(v.mdn)}</a></div>` : '';
    return `<li class="v"><a class="th" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" aria-label="${esc(v.t)}"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" onerror="this.remove()"></a>
      <div class="tx"><a class="tt" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.t)}</a><div class="ag">${ago}</div>${sits}</div></li>`;
  }).join('');
}

/* language */
function applyLang(){
  document.documentElement.lang = lang; $('lt').style.fontWeight = lang==='th'?'700':'400'; $('le').style.fontWeight = lang==='en'?'700':'400';
  document.querySelectorAll('[data-i]').forEach(el => { const s = t(el.dataset.i); if (s) el.innerHTML = s; });
  document.title = lang==='th' ? 'เชียงใหม่ของพิม บนมดแดง' : 'Your Chiang Mai, on Mot Dang';
  $('play').textContent = t(timer ? 'pause' : (Y===6 ? 'replay':'play'));
  $('hint').textContent = t('hint');
  $('vsrc').innerHTML = t('vsrc');
  $('foot').innerHTML = t('foot');
  $('srclist').innerHTML = ['s1','s2','s3','s4','s5'].map(k=>`<li>${t(k,{n:N,all:208})}</li>`).join('');
  $('coffee').href = 'mailto:nan@motdang.net?subject=' + encodeURIComponent(t('mailsub')) + '&body=' + encodeURIComponent(t('mailbody'));
  renderControls(); renderCard(); renderVids();
}
$('lang').onclick = () => { lang = lang==='th' ? 'en' : 'th'; applyLang(); };

buildYears();
$('count').textContent = 0;
applyLang();
setCount(cum[Y]);
$('play').textContent = t('play');
</script>
</body>
</html>

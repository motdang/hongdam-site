:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Iowan Old Style","Times New Roman","Noto Serif Thai",serif;overflow-x:hidden}
[lang=th] body, body.th{font-family:"Noto Serif Thai","Sarabun",Georgia,serif;line-height:1.7}
body.th h1{line-height:1.25}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;font:600 13px/1 system-ui,-apple-system,"Sarabun",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{font:600 14px/1 system-ui,"Sarabun",sans-serif;border:0;background:transparent;color:var(--muted);padding:10px 14px;min-height:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
h1{font-size:clamp(40px,11vw,76px);line-height:1.02;margin:28px 0 14px;letter-spacing:-.02em;font-weight:700}
.lead{font-size:20px;color:var(--ink);margin:0 0 6px;max-width:34em}
.for{color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow)}
.stat b{display:block;font:700 34px/1.1 Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{display:block;font:500 13px/1.3 system-ui,"Sarabun",sans-serif;color:var(--muted);margin-top:4px}
.stat .w{font:700 22px/1.5 Georgia,"Noto Serif Thai",serif}
.src{font:13px/1.45 system-ui,-apple-system,"Sarabun",sans-serif;color:var(--muted);margin:6px 0}
.src a{color:var(--muted)}
section{margin:38px 0}
h2{font-size:26px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
.mapbox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin:0 -16px}
@media(min-width:792px){.mapbox{margin:0}}
#map{height:min(50vh,440px);min-height:320px;background:#e9e4da}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #map canvas{filter:brightness(.85) contrast(1.05)}}
.nomap{display:none;padding:18px;color:var(--muted);font:15px/1.5 system-ui,sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:12px;box-shadow:var(--shadow);min-height:150px}
.card .k{font:600 12px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card h3{margin:0 0 2px;font-size:22px;line-height:1.3}
.card .sub{color:var(--muted);margin:0 0 10px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font:15px/1.45 system-ui,"Sarabun",sans-serif}
.card dt{color:var(--muted)}.card dd{margin:0}
.card .one{margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font:700 16px/1.2 system-ui,"Sarabun",sans-serif;text-decoration:none;border:0;cursor:pointer}
.btn:focus-visible,.lang button:focus-visible,.stat:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font:14px/1.5 system-ui,"Sarabun",sans-serif;color:var(--muted);margin:10px 0 0}
.filter{display:flex;gap:8px;margin:14px 0 8px}
.filter select{flex:1;min-height:44px;font:16px system-ui,"Sarabun",sans-serif;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 10px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit;font:inherit;cursor:pointer;min-height:48px}
.row small{display:block;font:13px/1.4 system-ui,"Sarabun",sans-serif;color:var(--muted)}
.row[aria-current=true]{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.clock{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:620px){.clock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.ev h3{margin:0 0 2px;font-size:18px;line-height:1.3}
.ev .d{font:14px/1.4 system-ui,"Sarabun",sans-serif;color:var(--muted);margin-bottom:10px}
.t{display:flex;flex-wrap:wrap;gap:10px;font-variant-numeric:tabular-nums}
.t div{text-align:center;min-width:44px}
.t b{display:block;font:700 30px/1.1 Georgia,serif}
.t span{font:12px/1.2 system-ui,"Sarabun",sans-serif;color:var(--muted)}
.routes{margin:8px 0 14px;padding-left:20px}
.routes li{margin:4px 0}
.slot{border:1.5px dashed var(--line);border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font:13px system-ui,sans-serif;margin:0}
footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0 40px;font:14px/1.6 system-ui,-apple-system,"Sarabun",sans-serif;color:var(--muted)}

    e.textContent=v.replace('%N%',S.length);
  });
  document.title = lang==='th' ? '34 โรงเรียน หนึ่งจังหวัด' : '34 schools, one province';
  $('routes').innerHTML=''; t('routes').forEach(function(r){var li=document.createElement('li');li.textContent=r;$('routes').appendChild(li);});
  var m='mailto:nan@motdang.net?subject='+encodeURIComponent(t('mailSubject'))+'&body='+encodeURIComponent(t('mailBody'));
  $('lunch').setAttribute('href',m);
  buildDistricts(); buildList(); showCard(selected); tickAll(); counters(false);
}
function buildDistricts(){
  var sel=$('dist'), cur=sel.value||'';
  var seen={}, opts=[];
  S.forEach(function(s){ if(!seen[s.amphoe]){seen[s.amphoe]=1; opts.push(s);} });
  opts.sort(function(a,b){return (lang==='th'?a.amphoe.localeCompare(b.amphoe,'th'):a.amphoeEn.localeCompare(b.amphoeEn));});
  sel.innerHTML='';
  var o=document.createElement('option');o.value='';o.textContent=t('dAll');sel.appendChild(o);
  opts.forEach(function(s){var o=document.createElement('option');o.value=s.amphoe;o.textContent=lang==='th'?s.amphoe:s.amphoeEn;sel.appendChild(o);});
  sel.value=cur;
}
function nm(s){ return lang==='th' ? s.th : (s.en||s.th); }
function buildList(){
  var ul=$('list'), f=$('dist').value; ul.innerHTML='';
  S.filter(function(s){return !f||s.amphoe===f;}).sort(function(a,b){return a.amphoe.localeCompare(b.amphoe,'th')||a.th.localeCompare(b.th,'th');}).forEach(function(s){
    var li=document.createElement('li'), b=document.createElement('button');
    b.type='button'; b.className='row'; b.dataset.i=s.i;
    if(selected===s.i) b.setAttribute('aria-current','true');
    b.innerHTML='';
    b.appendChild(document.createTextNode(nm(s)));
    var sm=document.createElement('small'); sm.textContent=(lang==='th'?s.amphoe:s.amphoeEn)+(lang==='en'&&s.en?' · '+s.th:''); b.appendChild(sm);
    b.addEventListener('click',function(){pick(s.i,true);});
    li.appendChild(b); ul.appendChild(li);
  });
  if(mapReady) filterMap(f);
}
function showCard(i){
  var c=$('card');
  if(i==null){ c.innerHTML=''; var p=document.createElement('p'); p.style.margin='0'; p.className='sub'; p.textContent=t('tap'); c.appendChild(p); return; }
  var s=S[i]; c.innerHTML='';
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
  c.appendChild(el('div','k',t('cardKick')));
  c.appendChild(el('h3','',s.th));
  var sub=lang==='en'?(s.en? s.en+(s.rom?' ('+t('romanised')+')':'') : ''):(s.en? s.en+(s.rom?' ('+t('romanised')+')':''):'');
  if(sub) c.appendChild(el('p','sub',sub));
  var dl=el('dl');
  function row(k,v){dl.appendChild(el('dt','',k));dl.appendChild(el('dd','',v));}
  row(t('district'), lang==='th'?s.amphoe:s.amphoeEn+' · '+s.amphoe);
  row(t('classes'), lvl(s.levels));
  if(s.students!=null) row(t('students'), s.students.toLocaleString(lang==='th'?'th-TH':'en-US'));
  c.appendChild(dl);
  c.appendChild(el('p','one',t('one')));
  var a=el('a','btn',t('give')); a.href='https://fercthailand.org/how-to-donate/'; a.target='_blank'; a.rel='noopener'; c.appendChild(a);
}
function pick(i,fly){
  selected=i;
  showCard(i);
  document.querySelectorAll('.row').forEach(function(r){ if(+r.dataset.i===i) r.setAttribute('aria-current','true'); else r.removeAttribute('aria-current'); });
  if(mapReady){
    map.setFilter('sel',['==',['get','i'],i]);
    if(fly){ var s=S[i]; map.flyTo({center:[s.lng,s.lat],zoom:Math.max(map.getZoom(),11),duration:700}); document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'}); }
    else { $('card').scrollIntoView({behavior:'smooth',block:'nearest'}); }
  }
}
function filterMap(f){
  if(!mapReady) return;
  map.setFilter('pins', f?['==',['get','amphoe'],f]:null);
  var list=S.filter(function(s){return !f||s.amphoe===f;});
  fit(list);
}
function fit(list){
  var b=new maplibregl.LngLatBounds();
  list.forEach(function(s){b.extend([s.lng,s.lat]);});
  if(list.length===1) map.flyTo({center:[list[0].lng,list[0].lat],zoom:11});
  else map.fitBounds(b,{padding:{top:40,bottom:40,left:30,right:30},duration:600,maxZoom:12});
}
function initMap(){
  try{
    map=new maplibregl.Map({container:'map',attributionControl:{compact:true},style:'https://tiles.openfreemap.org/styles/liberty',center:[98.98,18.79],zoom:8,attributionControl:{compact:true},cooperativeGestures:false});
  }catch(e){ $('map').style.display='none'; $('nomap').style.display='block'; return; }
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.on('load',function(){
    var feats=S.map(function(s){return {type:'Feature',properties:{i:s.i,amphoe:s.amphoe},geometry:{type:'Point',coordinates:[s.lng,s.lat]}};});
    map.addSource('prov',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:DATA.boundary}}});
    map.addLayer({id:'prov-line',type:'line',source:'prov',paint:{'line-color':cssv('--boundary'),'line-width':1.6,'line-opacity':.7,'line-dasharray':[3,2]}});
    map.addSource('sch',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
    map.addLayer({id:'pins',type:'circle',source:'sch',paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,6,12,10],'circle-color':cssv('--pin'),'circle-stroke-color':cssv('--pin-ring'),'circle-stroke-width':2}});
    map.addLayer({id:'sel',type:'circle',source:'sch',filter:['==',['get','i'],-1],paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,10,12,15],'circle-color':cssv('--sel'),'circle-stroke-color':'#000000','circle-stroke-width':2.5}});
    mapReady=true;
    fit(S);
    map.on('click',function(e){
      var p=e.point, bb=[[p.x-16,p.y-16],[p.x+16,p.y+16]];
      var f=map.queryRenderedFeatures(bb,{layers:['pins']});
      if(f.length){
        var best=null,bd=1e9;
        f.forEach(function(x){var q=map.project(x.geometry.coordinates),d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){bd=d;best=x;}});
        pick(best.properties.i,false);
      }
    });
    map.on('mousemove',function(e){var p=e.point;var f=map.queryRenderedFeatures([[p.x-8,p.y-8],[p.x+8,p.y+8]],{layers:['pins']});map.getCanvas().style.cursor=f.length?'pointer':'';});
    if(selected!=null) map.setFilter('sel',['==',['get','i'],selected]);
    window.__mapLoaded=true;
  });
  map.on('error',function(e){ window.__mapErr=(e&&e.error&&e.error.message)||'err'; });
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* counters */
function counters(animate){
  document.querySelectorAll('.stat').forEach(function(b){
    var c=b.getAttribute('data-c'); if(c==='w') return;
    var n=+c, out=b.querySelector('b');
    var pf=b.getAttribute('data-p')||'';
    if(!animate){ out.textContent=pf+n; return; }
    var t0=null;
    (function step(ts){ if(!t0) t0=ts; var p=Math.min(1,(ts-t0)/900); out.textContent=pf+Math.round(n*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); })(performance.now?performance.now():0);
  });
}
/* countdowns */
function tickAll(){
  document.querySelectorAll('[data-cd]').forEach(function(el){
    var ms=new Date(el.getAttribute('data-cd')).getTime()-Date.now();
    var bs=el.querySelectorAll('b');
    if(ms<=0){ bs.forEach(function(b){b.textContent='0';}); return; }
    var s=Math.floor(ms/1000);
    var v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    bs.forEach(function(b,i){b.textContent=i===0?v[i]:String(v[i]).padStart(2,'0');});
  });
}
document.addEventListener('DOMContentLoaded',function(){
  $('b-th').addEventListener('click',function(){lang='th';applyLang();});
  $('b-en').addEventListener('click',function(){lang='en';applyLang();});
  $('dist').addEventListener('change',function(){buildList();});
  document.querySelectorAll('.stat').forEach(function(b){b.addEventListener('click',function(){counters(true);});});
  applyLang();
  counters(true);
  setInterval(tickAll,1000);
  if(window.maplibregl) initMap(); else { $('map').style.display='none'; $('nomap').style.display='block'; }
});
</script>
</body>
</html>
